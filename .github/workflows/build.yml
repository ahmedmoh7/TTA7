name: Build TTA7 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/precache-controls-from-nov5-baseline]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/tta7-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=../tta7-release-key.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

      - name: Create environment file
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GITHUB_RELEASE_API_URL: ${{ secrets.GITHUB_RELEASE_API_URL }}
          GITHUB_RELEASE_PAGE_URL: ${{ secrets.GITHUB_RELEASE_PAGE_URL }}
          GITHUB_RELEASE_REPO: ${{ secrets.GITHUB_RELEASE_REPO }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROXY_URL: ${{ secrets.SUPABASE_PROXY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          {
            echo "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID"
            echo "GITHUB_RELEASE_API_URL=$GITHUB_RELEASE_API_URL"
            echo "GITHUB_RELEASE_PAGE_URL=$GITHUB_RELEASE_PAGE_URL"
            echo "GITHUB_RELEASE_REPO=$GITHUB_RELEASE_REPO"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_PROXY_URL=$SUPABASE_PROXY_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate TTA7 app icons and splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build TTA7 APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          flutter build apk --release \
            --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" \
            --dart-define=LASTFM_API_SECRET="$LASTFM_API_SECRET"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTA7-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
